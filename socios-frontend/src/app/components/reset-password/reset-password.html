<div class="admin-page">
<div class="auth-card">
  <div class="auth-header">
    <span class="auth-logo">4x</span>
    <h1>Elegí tu contraseña nueva</h1>
  </div>

  @if (successMessage) {
  <p class="auth-success">{{ successMessage }}</p>
  <a routerLink="/admin" class="auth-submit">Ir al ingreso</a>
  } @else if (token) {
  <form class="auth-form" (ngSubmit)="submit()">
    <input type="password" class="auth-input" name="newPassword" autocomplete="new-password"
           placeholder="Contraseña nueva" [(ngModel)]="newPassword" [disabled]="submitting" autofocus>
    <input type="password" class="auth-input" name="confirmPassword" autocomplete="new-password"
           placeholder="Repetí la contraseña nueva" [(ngModel)]="confirmPassword" [disabled]="submitting">

    <p class="auth-hint">Mínimo {{ minLength }} caracteres, con al menos una letra y un número.</p>

    @if (error) {
    <p class="auth-error">{{ error }}</p>
    }

    <button type="submit" class="auth-submit" [disabled]="submitting || !newPassword || !confirmPassword">
      {{ submitting ? 'Guardando...' : 'Guardar contraseña' }}
    </button>
  </form>
  } @else {
  <p class="auth-error">{{ error }}</p>
  <a routerLink="/admin" class="back-link">Ir al ingreso</a>
  }
</div>
</div>
