<form class="auth-form" (ngSubmit)="submit()">
  @if (forced) {
  <p class="auth-hint">Entraste con una contraseña temporal. Para seguir, elegí tu propia contraseña.</p>
  }

  <input type="password" class="auth-input" name="currentPassword" autocomplete="current-password"
         [placeholder]="forced ? 'Contraseña temporal' : 'Contraseña actual'"
         [(ngModel)]="currentPassword" [disabled]="submitting">
  <input type="password" class="auth-input" name="newPassword" autocomplete="new-password"
         placeholder="Contraseña nueva" [(ngModel)]="newPassword" [disabled]="submitting">
  <input type="password" class="auth-input" name="confirmPassword" autocomplete="new-password"
         placeholder="Repetí la contraseña nueva" [(ngModel)]="confirmPassword" [disabled]="submitting">

  <p class="auth-hint">Mínimo {{ minLength }} caracteres, con al menos una letra y un número.</p>

  @if (error) {
  <p class="auth-error">{{ error }}</p>
  }

  <button type="submit" class="auth-submit"
          [disabled]="submitting || !currentPassword || !newPassword || !confirmPassword">
    {{ submitting ? 'Guardando...' : 'Guardar contraseña' }}
  </button>

  @if (!forced) {
  <button type="button" class="auth-link" (click)="cancelled.emit()">Cancelar</button>
  }
</form>
